<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Velmora Bay 3D — Open-World Crime</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a0f14; font-family: 'Segoe UI', system-ui, sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .hud { position: fixed; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.8); pointer-events: none; z-index: 5; }
  #hud-topleft { top: 14px; left: 16px; font-size: 20px; font-weight: 700; }
  #hud-healthbar { width: 190px; height: 10px; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.5); margin-top: 6px; }
  #hud-health { height: 100%; width: 100%; background: #22c55e; }
  #hud-topright { top: 14px; right: 16px; text-align: right; font-size: 20px; }
  #hud-stars { font-size: 24px; letter-spacing: 2px; }
  #hud-mission { font-size: 14px; opacity: .9; margin-top: 4px; }
  #hud-objective { bottom: 118px; left: 50%; transform: translateX(-50%); font-size: 17px; font-weight: 600; background: rgba(0,0,0,.5); padding: 8px 16px; border-radius: 6px; white-space: nowrap; }
  #hud-bottomright { bottom: 16px; right: 16px; text-align: right; font-size: 15px; }
  #hud-speed { font-size: 26px; font-weight: 700; }
  #hud-radio { color: #fbbf24; font-size: 13px; margin-top: 2px; }
  #hud-armed { font-size: 13px; opacity: .85; margin-top: 2px; }
  #hud-banner { top: 22%; left: 50%; transform: translateX(-50%); font-size: 30px; font-weight: 800; color: #facc15; text-align: center; transition: opacity .4s; white-space: nowrap; }
  #hud-screen { top: 46%; left: 50%; transform: translate(-50%,-50%); font-size: 22px; font-weight: 700; text-align: center; }
  #hud-title { top: 12%; left: 50%; transform: translateX(-50%); text-align: center; display: none; }
  #hud-title h1 { margin: 0; font-size: 56px; letter-spacing: 4px; color: #facc15; text-shadow: 0 2px 0 #7f1d1d, 0 4px 18px rgba(0,0,0,.7); }
  #hud-title p { margin: 6px 0 0; font-size: 17px; color: #fff; }
  #hud-title .keys { font-size: 13px; opacity: .85; margin-top: 14px; line-height: 1.7; }
  #minimap { position: fixed; left: 16px; bottom: 16px; width: 180px; height: 180px; border: 2px solid rgba(255,255,255,.45); border-radius: 50%; z-index: 5; pointer-events: none; }
  #hud-flash { position: fixed; inset: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(220,0,0,.55) 100%); opacity: 0; pointer-events: none; z-index: 4; }
</style>
</head>
<body>
<canvas id="game" aria-label="Velmora Bay 3D: an open-world crime game. Drive, steal cars, dodge the police and finish Mara's five jobs."></canvas>
<canvas id="minimap" width="180" height="180" aria-hidden="true"></canvas>
<div id="hud-topleft" class="hud"><span id="hud-cash">$0</span><div id="hud-healthbar"><div id="hud-health"></div></div></div>
<div id="hud-topright" class="hud"><div id="hud-stars">☆☆☆☆☆</div><div id="hud-mission"></div></div>
<div id="hud-objective" class="hud"></div>
<div id="hud-bottomright" class="hud"><div id="hud-speed"></div><div id="hud-radio"></div><div id="hud-armed"></div></div>
<div id="hud-banner" class="hud"></div>
<div id="hud-screen" class="hud"></div>
<div id="hud-title" class="hud"><h1>VELMORA BAY</h1><p>An open-world crime story — five jobs, one city, no mercy.</p><p class="keys">WASD move / drive &nbsp;·&nbsp; Shift sprint &nbsp;·&nbsp; E enter car / interact &nbsp;·&nbsp; F punch &nbsp;·&nbsp; Click shoot (after Job 1)<br>Space handbrake &nbsp;·&nbsp; R radio &nbsp;·&nbsp; M mute &nbsp;·&nbsp; P pause &nbsp;·&nbsp; Drag mouse to look around</p></div>
<div id="hud-flash"></div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
